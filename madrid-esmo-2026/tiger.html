<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="2026年10月24日 TigerMed 酒会的两张入场码。">
  <meta name="theme-color" content="#efe6d6">
  <meta name="color-scheme" content="light dark">
  <title>泰格酒会入场码</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("madrid-esmo-2026-theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
        var f = localStorage.getItem("madrid-esmo-2026-font");
        if (f !== "sm" && f !== "md" && f !== "lg" && f !== "xl") f = "md";
        document.documentElement.setAttribute("data-font", f);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", t === "dark" ? "#14110e" : "#efe6d6");
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #efe6d6;
      --card: #fffaf3;
      --ink: #1c1712;
      --muted: #5e564c;
      --line: #e3d5c2;
      --accent: #9a3412;
      --on-accent: #fffaf3;
      --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Segoe UI", sans-serif;
      --serif: "Iowan Old Style", Palatino, "Palatino Linotype", "Songti SC", "STSong", serif;
      color-scheme: light;
    }
    :root[data-theme="dark"] {
      --bg: #14110e;
      --card: #221c17;
      --ink: #f6efe6;
      --muted: #cbbba8;
      --line: #3a322a;
      --accent: #e7b089;
      --on-accent: #2a140e;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html[data-font="sm"] { font-size: 16px; }
    html[data-font="md"] { font-size: 18px; }
    html[data-font="lg"] { font-size: 20px; }
    html[data-font="xl"] { font-size: 23px; }
    html, body { max-width: 100%; overflow-x: clip; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.45;
    }
    main {
      width: 100%;
      max-width: 32rem;
      margin: 0 auto;
      padding: 0.85rem 0.75rem 2.5rem;
    }
    a.back {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
    h1 {
      font-family: var(--serif);
      font-size: 1.7rem;
      line-height: 1.2;
      margin: 0.6rem 0 0.25rem;
    }
    .meta, .note, .hint { color: var(--muted); margin: 0.35rem 0; }
    .tools { display: flex; gap: 0.5rem; margin: 0.8rem 0; }
    .tools button, .names a {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
    }
    .names { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin: 0.8rem 0; }
    .names a { text-align: center; font-size: 1.15rem; }
    .names a[aria-current="true"] {
      background: var(--accent);
      color: var(--on-accent);
      border-color: var(--accent);
    }
    .pass {
      width: 100%;
      background: #fff;
      color: #1c1712;
      border-radius: 1.1rem;
      padding: 0.7rem 0.7rem 0.85rem;
      text-align: center;
    }
    .pass img {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      image-rendering: pixelated;
    }
    .pass figcaption { font-weight: 700; margin-top: 0.4rem; }
    .note { font-size: 0.92rem; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html#b24-party">回到 24 日酒会</a>
    <h1>泰格酒会入场码</h1>
    <p class="meta">10月24日 17:30–21:00 · Rosewood Villa Magna</p>
    <div class="tools">
      <button type="button" id="theme-btn">深色</button>
      <button type="button" id="font-btn">字号</button>
    </div>
    <nav class="names" aria-label="选择入场码">
      <a href="#1" data-who="1">第 1 张</a>
      <a href="#2" data-who="2">第 2 张</a>
      <a href="#ming" data-who="ming">明</a>
    </nav>
    <figure class="pass">
      <img id="qr" alt="" width="580" height="580">
      <figcaption id="cap"></figcaption>
    </figure>
    <p class="hint">第 1 张和第 2 张是同一订单里的两张通用票，码不一样。明是单独一张。屏幕调亮，正对扫码口。一人用一张。</p>
    <p class="note">这页和行程用同一个链接。拿到链接的人能打开这三张码。</p>
  </main>
  <script>
    (function () {
      var THEME_KEY = "madrid-esmo-2026-theme";
      var FONT_KEY = "madrid-esmo-2026-font";
      var FONTS = ["sm", "md", "lg", "xl"];
      var FONT_LABEL = { sm: "小", md: "中", lg: "大", xl: "特大" };
      var TICKETS = {
        "1": { name: "第 1 张", file: "tickets/tiger-1.png" },
        "2": { name: "第 2 张", file: "tickets/tiger-2.png" },
        ming: { name: "明", file: "tickets/tiger-ming.png" }
      };
      function themeNow() {
        return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
      }
      function paintTheme(t, persist) {
        document.documentElement.setAttribute("data-theme", t);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", t === "dark" ? "#14110e" : "#efe6d6");
        if (persist) localStorage.setItem(THEME_KEY, t);
        var btn = document.getElementById("theme-btn");
        btn.textContent = t === "dark" ? "浅色" : "深色";
        btn.setAttribute("aria-label", t === "dark" ? "切换到浅色" : "切换到深色");
      }
      function fontNow() {
        var f = document.documentElement.getAttribute("data-font");
        return FONTS.indexOf(f) >= 0 ? f : "md";
      }
      function paintFont(f, persist) {
        if (FONTS.indexOf(f) < 0) f = "md";
        document.documentElement.setAttribute("data-font", f);
        if (persist) localStorage.setItem(FONT_KEY, f);
        var btn = document.getElementById("font-btn");
        btn.textContent = "字号" + FONT_LABEL[f];
        btn.setAttribute("aria-label", "字号" + FONT_LABEL[f] + "，点按切换");
      }
      function who() {
        var id = (location.hash || "#1").slice(1);
        return TICKETS[id] ? id : "1";
      }
      function show() {
        var id = who();
        var t = TICKETS[id];
        if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
        var img = document.getElementById("qr");
        img.src = t.file;
        img.alt = "泰格酒会" + t.name;
        document.getElementById("cap").textContent = t.name;
        document.title = "泰格酒会" + t.name;
        Array.prototype.forEach.call(document.querySelectorAll(".names a"), function (a) {
          if (a.getAttribute("data-who") === id) a.setAttribute("aria-current", "true");
          else a.removeAttribute("aria-current");
        });
      }
      document.getElementById("theme-btn").addEventListener("click", function () {
        paintTheme(themeNow() === "dark" ? "light" : "dark", true);
      });
      document.getElementById("font-btn").addEventListener("click", function () {
        paintFont(FONTS[(FONTS.indexOf(fontNow()) + 1) % FONTS.length], true);
      });
      window.addEventListener("hashchange", show);
      paintTheme(themeNow(), false);
      paintFont(fontNow(), false);
      show();
    })();
  </script>
</body>
</html>
